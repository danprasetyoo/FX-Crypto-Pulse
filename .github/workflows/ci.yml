# CI: lint + unit test + build di setiap push dan PR (Definition of Done PRD),
# lalu e2e Playwright terhadap stack docker compose penuh.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test-build:
    name: Lint, unit test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: lint-test-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: market-service
            dockerfile: infra/docker/node-service.Dockerfile
            context: .
            build_args: SERVICE=market-service
          - name: user-service
            dockerfile: infra/docker/node-service.Dockerfile
            context: .
            build_args: SERVICE=user-service
          - name: alert-worker
            dockerfile: infra/docker/node-service.Dockerfile
            context: .
            build_args: SERVICE=alert-worker
          - name: mock-upstream
            dockerfile: infra/docker/node-service.Dockerfile
            context: .
            build_args: SERVICE=mock-upstream
          - name: web
            dockerfile: infra/docker/web.Dockerfile
            context: .
            build_args: ''
          - name: gateway
            dockerfile: infra/gateway/Dockerfile
            context: infra/gateway
            build_args: ''
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  e2e:
    name: E2E (Playwright, docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: lint-test-build
    env:
      COMPOSE_FILES: -f docker-compose.yml -f docker-compose.e2e.yml
      E2E_BASE_URL: http://localhost:8080
      E2E_MAILPIT_URL: http://localhost:8025
      E2E_MOCK_URL: http://localhost:4000
      E2E_WORKER_URL: http://localhost:3003
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start stack
        run: |
          cp .env.example .env
          docker compose $COMPOSE_FILES up -d --build --wait --wait-timeout 300

      - name: Smoke check
        run: |
          curl -fsS http://localhost:8080/api/health/market
          curl -fsS http://localhost:8080/api/health/user
          curl -fsS http://localhost:3003/health
          curl -fsS http://localhost:4000/health

      - name: Run e2e
        run: npm run e2e

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose $COMPOSE_FILES logs --no-color --tail=300

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

      - name: Stop stack
        if: always()
        run: docker compose $COMPOSE_FILES down -v
