# Stack lengkap FX & Crypto Pulse (dev/staging).
#   docker compose up -d --build --wait
# Lihat .env.example untuk variabel. Untuk e2e tambahkan -f docker-compose.e2e.yml.

name: fx-crypto-pulse

x-node-env: &node-env
  NODE_ENV: ${NODE_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fxpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fxpulse}
      POSTGRES_DB: ${POSTGRES_DB:-fxpulse}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-fxpulse} -d ${POSTGRES_DB:-fxpulse}']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command:
      [
        'redis-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--maxmemory',
        '128mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Penangkap email untuk dev/staging. UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  market-service:
    image: ${IMAGE_PREFIX:-fxpulse}/market-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
      args: { SERVICE: market-service }
    environment:
      <<: *node-env
      PORT: 3001
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      FRANKFURTER_BASE_URL: ${FRANKFURTER_BASE_URL:-https://api.frankfurter.dev/v1}
      COINGECKO_BASE_URL: ${COINGECKO_BASE_URL:-https://api.coingecko.com/api/v3}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-5000}
      UPSTREAM_MAX_RETRIES: ${UPSTREAM_MAX_RETRIES:-2}
      CACHE_TTL_CRYPTO_TOP_SEC: ${CACHE_TTL_CRYPTO_TOP_SEC:-60}
      CACHE_TTL_CRYPTO_HISTORY_SEC: ${CACHE_TTL_CRYPTO_HISTORY_SEC:-3600}
      CACHE_TTL_FX_SEC: ${CACHE_TTL_FX_SEC:-3600}
      MARKET_ADMIN_ENABLED: ${MARKET_ADMIN_ENABLED:-false}
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3001/api/health']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  user-service:
    image: ${IMAGE_PREFIX:-fxpulse}/user-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
      args: { SERVICE: user-service }
    environment:
      <<: *node-env
      PORT: 3002
      DATABASE_URL: ${DATABASE_URL:-postgres://fxpulse:fxpulse@postgres:5432/fxpulse}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-at-least-32-chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-FX & Crypto Pulse <no-reply@fxpulse.local>}
    depends_on:
      postgres: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3002/api/health']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  alert-worker:
    image: ${IMAGE_PREFIX:-fxpulse}/alert-worker:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
      args: { SERVICE: alert-worker }
    environment:
      <<: *node-env
      PORT: 3003
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DATABASE_URL: ${DATABASE_URL:-postgres://fxpulse:fxpulse@postgres:5432/fxpulse}
      MARKET_SERVICE_URL: http://market-service:3001
      ALERT_INTERVAL_MS: ${ALERT_INTERVAL_MS:-300000}
      ALERT_RUN_ON_START: ${ALERT_RUN_ON_START:-true}
      WORKER_ADMIN_ENABLED: ${WORKER_ADMIN_ENABLED:-false}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-FX & Crypto Pulse <no-reply@fxpulse.local>}
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      # user-service menjalankan migrasi; worker menunggu skema siap.
      user-service: { condition: service_healthy }
      market-service: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3003/health']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  web:
    image: ${IMAGE_PREFIX:-fxpulse}/web:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped

  gateway:
    image: ${IMAGE_PREFIX:-fxpulse}/gateway:${IMAGE_TAG:-local}
    build:
      context: infra/gateway
    environment:
      MARKET_SERVICE_HOST: market-service
      MARKET_SERVICE_PORT: 3001
      USER_SERVICE_HOST: user-service
      USER_SERVICE_PORT: 3002
      WEB_HOST: web
      WEB_PORT: 80
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-30r/m}
      AUTH_RATE_BURST: ${AUTH_RATE_BURST:-20}
    ports:
      - '${GATEWAY_PORT:-8080}:8080'
    depends_on:
      market-service: { condition: service_healthy }
      user-service: { condition: service_healthy }
      web: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
